const hookData = DASH['7_hook型別'].slice(1).filter(r => parseInt(r[1]) > 3).sort((a,b) => parseFloat(b[3]) - parseFloat(a[3]));
new Chart($('hookChart').getContext('2d'), {
  type: 'bar',
  data: {
    labels: hookData.map(r => r[0]),
    datasets: [{
      label: 'views平均',
      data: hookData.map(r => parseFloat(r[3])),
      backgroundColor: '#84cc16',
    }],
  },
  options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } },
});

// TOP 20 table
const top20 = DASH['8_TOP20'].slice(1);
const tbody = $('top20Body');
top20.forEach((r) => {
  const rank = parseInt(r[0]);
  const badgeClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><span class="rank-badge ${badgeClass}">${r[0]}}</span></td>
    <td class="font-bold text-sky-400">${fmt(parseInt(r[1]))}</td>
    <td>${r[2]}}</td>
    <td class="text-slate-400">${r[4]}}</td>
    <td><span class="px-2 py-1 rounded bg-slate-700 text-xs">${r[5]}}</span></td>
    <td class="text-purple-400">${r[7]}}</td>
    <td class="text-emerald-400">${r[8]}}</td>
    <td class="text-slate-500 text-xs">${r[9]}</td>
  `;
  tbody.appendChild(tr);
});
</script>

</body>
</html>
